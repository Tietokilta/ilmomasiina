# This compose file demonstrates how Ilmomasiina could be run in a production environment.

# This compose file serves Ilmomasiina at http://localhost:8000.
# Env variables from .env file (in the repository root) will be used by docker compose and passed to the container.
# Remember to create your own .env file (see .env.example)!

services:
  database:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_PASSWORD=$DB_PASSWORD
      - POSTGRES_USER=$DB_USER
      - POSTGRES_DB=$DB_DATABASE
      - PGDATA=$PGDATA
    volumes:
      - type: volume
        source: byilmostorage
        target: $PGDATA
        volume:
          subpath: pgdata
        #mountOptions: [ "uid=65534", "gid=65534", "dir_mode=0750", "file_mode=0750" ]

  ilmomasiina:
    build:
      context: .
      dockerfile: "Dockerfile"
      args:
        #- PATH_PREFIX=
        #- API_URL=
        - BRANDING_HEADER_TITLE_TEXT=BY Ilmomasiina
        - BRANDING_HEADER_TITLE_TEXT_SHORT=Ilmomasiina
        - BRANDING_FOOTER_GDPR_TEXT=Tietosuoja
        - BRANDING_FOOTER_GDPR_LINK=https://bratislawayoughurt.fi/privacy-policy/
        - BRANDING_FOOTER_HOME_TEXT=Bratislawayoughurt.fi
        - BRANDING_FOOTER_HOME_LINK=http://bratislawayoughurt.fi
        - BRANDING_LOGIN_PLACEHOLDER_EMAIL=admin@bratislawayoughurt.fi
    restart: always
    depends_on:
      - database
    environment:
      - DB_HOST=database
      - NODE_ENV=production
      - ENFORCE_HTTPS=false
      - PORT=3000
      # When deploying to production, either set ENFORCE_HTTPS true (default) or
      # configure the reverse proxy to enforce HTTPS communication with the clients.
    env_file:
      - .env.production
    ports:
      - "8000:3000"
      #    volumes:
      #- "frontend:/opt/ilmomasiina/frontend"

volumes:
  byilmostorage:
    driver: azure_file
    driver_opts:
      share_name: byilmostorageshare
      storage_account_name: byilmostorage
    #  nginx:
    #    image: nginx:latest
    #    ports:
    #      - "8888:80"
    #    volumes:
    #      - "frontend:/usr/share/nginx/html"

