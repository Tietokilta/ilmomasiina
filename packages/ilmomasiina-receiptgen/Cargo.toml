[package]
name = "ilmomasiina_receiptgen"
version = "0.1.0"
edition = "2021"
authors = ["Lasse Kukkula <lasse.kukkula@tietokilta.fi>"]

[lib]
crate-type = ["cdylib"]

[dependencies]

napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json = "1.0.145"
laskugeneraattori = { path = "./crates/vendor/laskugeneraattori" }
garde = { version = "0.22.0", features = ["derive"] }
